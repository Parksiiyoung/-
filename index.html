<!DOCTYPE html>
<html lang="ko" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BITNANEUN — Design Studio</title>
    <meta name="description" content="BITNANEUN Design Studio. Est. 2006. Branding, Editorial, Digital, Space Design." />
    <meta name="theme-color" content="#FAFAF8" />

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'bg': '#FAFAF8',
              'bg-dark': '#F0F0EC',
              'text-primary': '#1A1A1A',
              'text-secondary': '#6B6B6B',
              'text-tertiary': '#999999',
              'border-subtle': '#E5E5E0',
              'border-strong': '#1A1A1A',
              'anniversary': '#8B6914',
              'accent': '#2C2C2C',
              'surface': '#FFFFFF',
              'surface-hover': '#F5F5F2',
              'error': '#C53030',
              'success': '#2F855A',
            },
            fontFamily: {
              'display': ['"Space Grotesk"', 'sans-serif'],
              'body': ['"Noto Sans KR"', 'sans-serif'],
              'mono': ['"JetBrains Mono"', 'monospace'],
            },
            maxWidth: {
              'site': '1440px',
              'reading': '680px',
            },
            spacing: {
              '18': '4.5rem',
              '22': '5.5rem',
              '30': '7.5rem',
              '34': '8.5rem',
              '38': '9.5rem',
              'section': '10rem',
            },
            fontSize: {
              'hero': ['clamp(3rem, 8vw, 7.5rem)', { lineHeight: '0.9', letterSpacing: '-0.03em', fontWeight: '700' }],
              'page-title': ['clamp(2.5rem, 5vw, 4rem)', { lineHeight: '1.1', letterSpacing: '-0.02em', fontWeight: '700' }],
              'section-title': ['clamp(1.75rem, 3vw, 2.5rem)', { lineHeight: '1.2', fontWeight: '500' }],
              'body-lg': ['1.125rem', { lineHeight: '1.8', fontWeight: '300' }],
              'body': ['0.9375rem', { lineHeight: '1.7' }],
              'caption': ['0.6875rem', { lineHeight: '1.5', letterSpacing: '0.15em', fontWeight: '400' }],
              'nav': ['0.6875rem', { lineHeight: '1', letterSpacing: '0.12em', fontWeight: '500' }],
            },
            gridTemplateColumns: {
              '12': 'repeat(12, minmax(0, 1fr))',
            },
            transitionTimingFunction: {
              'out-expo': 'cubic-bezier(0.22, 1, 0.36, 1)',
            },
            keyframes: {
              'fade-in': {
                from: { opacity: '0' },
                to: { opacity: '1' },
              },
            },
            animation: {
              'fade-in': 'fade-in 0.5s ease-out forwards',
            },
          },
        },
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Noto+Sans+KR:wght@100;300;400;500;700;900&family=JetBrains+Mono:wght@300;400;500&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="./styles/animations.css" />

    <style>
      *, *::before, *::after { box-sizing: border-box; }
      body {
        font-family: 'Noto Sans KR', sans-serif;
        background-color: #FAFAF8;
        color: #1A1A1A;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      ::selection {
        background-color: #1A1A1A;
        color: #FAFAF8;
      }
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #C8C8C4; border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: #999; }
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>

    <script type="importmap">
{
  "imports": {
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "marked": "https://aistudiocdn.com/marked@^17.0.1"
  }
}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
