<!DOCTYPE html>
<html lang="ko" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>디자인을 위한 스타일 연표 (1920-2010)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: 'Noto Sans KR', sans-serif;
      }
      /* Custom scrollbar for aesthetic consistency */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #f1f1f1;
      }
      ::-webkit-scrollbar-thumb {
        background: #888;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #555;
      }
      .loading-sparkle {
        display: inline-block;
        animation: spin 2s linear infinite;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      
      /* AI Response Styling */
      .ai-response strong {
        color: #2563eb;
        font-weight: 700;
      }

      /* Hide scrollbar for Chrome, Safari and Opera */
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      /* Hide scrollbar for IE, Edge and Firefox */
      .no-scrollbar {
        -ms-overflow-style: none;  /* IE and Edge */
        scrollbar-width: none;  /* Firefox */
      }

      /* ===== Radio Signal Nav Styles ===== */
      .radio-signal-nav {
        background: linear-gradient(180deg, #1a1a1a 0%, #2a2a2a 100%);
        border-bottom: 2px solid #444;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255,255,255,0.05);
      }

      .radio-bar-bg {
        position: relative;
      }

      .radio-antenna-icon {
        color: #f59e0b;
        filter: drop-shadow(0 0 4px rgba(245, 158, 11, 0.5));
      }

      .radio-label {
        color: #a3a3a3;
        font-family: 'Noto Sans KR', monospace;
      }

      .signal-bar {
        width: 3px;
        background: #f59e0b;
        border-radius: 1px;
        transition: opacity 0.4s ease, background 0.4s ease;
        box-shadow: 0 0 4px rgba(245, 158, 11, 0.3);
      }

      .radio-freq-display {
        display: flex;
        align-items: baseline;
        gap: 4px;
      }

      .radio-freq-number {
        font-size: 28px;
        font-weight: 900;
        color: #f59e0b;
        font-family: 'Courier New', monospace;
        letter-spacing: -1px;
        text-shadow: 0 0 12px rgba(245, 158, 11, 0.4);
        line-height: 1;
      }

      .radio-freq-unit {
        font-size: 10px;
        color: #737373;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      .radio-dial-track {
        position: relative;
        padding: 8px 0 0 0;
      }

      .radio-ticks-container {
        position: absolute;
        top: 0;
        left: 8px;
        right: 8px;
        bottom: 24px;
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        pointer-events: none;
        opacity: 0.3;
      }

      .radio-tick {
        width: 1px;
        background: #666;
      }

      .radio-tick-major {
        height: 14px;
        background: #888;
      }

      .radio-tick-minor {
        height: 7px;
      }

      .radio-station {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 4px 12px 6px;
        cursor: pointer;
        border: none;
        background: none;
        transition: all 0.3s ease;
        position: relative;
        flex-shrink: 0;
        min-width: 64px;
      }

      .radio-station:hover .radio-needle-dot {
        background: #f59e0b;
        box-shadow: 0 0 8px rgba(245, 158, 11, 0.6);
      }

      .radio-station-active {
        transform: scale(1);
      }

      .radio-station-inactive {
        opacity: 0.6;
      }

      .radio-station-inactive:hover {
        opacity: 0.9;
      }

      .radio-needle {
        display: flex;
        flex-direction: column;
        align-items: center;
        margin-bottom: 4px;
        transition: all 0.3s ease;
      }

      .radio-needle-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #555;
        transition: all 0.4s ease;
        margin-bottom: 2px;
      }

      .radio-needle-dot-active {
        background: #f59e0b !important;
        box-shadow: 0 0 12px rgba(245, 158, 11, 0.8), 0 0 24px rgba(245, 158, 11, 0.3);
        animation: radio-pulse 2s ease-in-out infinite;
      }

      .radio-needle-line {
        width: 2px;
        height: 16px;
        background: #555;
        border-radius: 1px;
        transition: all 0.4s ease;
      }

      .radio-needle-line-active {
        background: #f59e0b;
        height: 22px;
        box-shadow: 0 0 6px rgba(245, 158, 11, 0.4);
      }

      .radio-station-label {
        font-size: 11px;
        font-weight: 700;
        color: #888;
        transition: all 0.3s ease;
        white-space: nowrap;
        font-family: 'Courier New', monospace;
      }

      .radio-station-label-active {
        color: #f5f5f5;
        text-shadow: 0 0 8px rgba(245, 245, 245, 0.3);
      }

      .radio-station-subtitle {
        font-size: 9px;
        color: #f59e0b;
        opacity: 0.8;
        white-space: nowrap;
        margin-top: 1px;
        animation: radio-fadein 0.3s ease;
      }

      @keyframes radio-pulse {
        0%, 100% { box-shadow: 0 0 12px rgba(245, 158, 11, 0.8), 0 0 24px rgba(245, 158, 11, 0.3); }
        50% { box-shadow: 0 0 18px rgba(245, 158, 11, 1), 0 0 36px rgba(245, 158, 11, 0.5); }
      }

      @keyframes radio-fadein {
        from { opacity: 0; transform: translateY(-4px); }
        to { opacity: 0.8; transform: translateY(0); }
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0",
    "marked": "https://aistudiocdn.com/marked@^17.0.1"
  }
}
</script>
</head>
  <body class="bg-white text-slate-900 antialiased">
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
